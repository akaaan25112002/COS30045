<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lab 7.2 D3 Pie Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    svg {
      font-family: sans-serif;
    }
    text {
      fill: white;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Lab 7.2 – D3 Pie Chart</h2>
  <svg width="300" height="300"></svg>

  <script>
    const data = [10, 20, 30, 15, 25]; // Between 5–10 values

    const width = 300;
    const height = 300;
    const radius = Math.min(width, height) / 2;

    const svg = d3.select("svg")
      .attr("width", width)
      .attr("height", height)
      .append("g")
      .attr("transform", `translate(${width / 2}, ${height / 2})`);

    // Pie layout: converts data to startAngle and endAngle
    const pie = d3.pie();

    // Arc generator
    const arc = d3.arc()
      .innerRadius(0) // Change to > 0 for donut chart
      .outerRadius(radius - 10);

    // Color scale
    const color = d3.scaleOrdinal(d3.schemeCategory10);

    // Create arcs
    const arcs = svg.selectAll("path")
      .data(pie(data))
      .enter()
      .append("path")
      .attr("d", arc)
      .attr("fill", (d, i) => color(i))
      .attr("stroke", "white")
      .attr("stroke-width", 2);

    // Add text labels
    svg.selectAll("text")
      .data(pie(data))
      .enter()
      .append("text")
      .attr("transform", d => `translate(${arc.centroid(d)})`)
      .attr("text-anchor", "middle")
      .text(d => d.value);
  </script>
</body>
</html>
