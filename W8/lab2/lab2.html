<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lab 8.2 – Victoria Unemployment Choropleth</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }

        h2 {
            padding: 20px;
            margin: 0;
            font-size: 24px;
        }

        svg {
            display: block;
            margin: auto;
            background-color: transparent;
        }

        .region {
            stroke: #fff;
            stroke-width: 0.5px;
        }

        .highlight {
            stroke: black;
            stroke-width: 2px;
        }

        .tooltip {
            position: absolute;
            text-align: left;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <h2>Lab 8.2 – Victoria Unemployment Choropleth</h2>

    <div id="chart"></div>

    <script>
        const width = 960;
        const height = 600;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const projection = d3.geoMercator()
            .center([145, -37])
            .translate([width / 2, height / 2])
            .scale(5000);

        const path = d3.geoPath().projection(projection);

        const color = d3.scaleQuantize()
            .range(d3.schemeBlues[7]);

        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("opacity", 0);

        Promise.all([
            d3.json("LGA_VIC.json"),
            d3.csv("VIC_LGA_unemployment.csv"),
            d3.csv("VIC_city.csv")
        ]).then(([geoData, unemploymentData, cityData]) => {
            const unemploymentMap = {};
            unemploymentData.forEach(d => {
                unemploymentMap[d.LGA.trim().toLowerCase()] = +d.unemployed;
            });

            // Set domain for color scale
            const values = Object.values(unemploymentMap);
            color.domain([d3.min(values), d3.max(values)]);

            // Draw map
            svg.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("class", "region")
                .attr("fill", d => {
                    const name = d.properties.LGA_name.trim().toLowerCase();
                    const val = unemploymentMap[name];
                    return val ? color(val) : "#eee";
                })
                .on("mouseover", function (event, d) {
                    d3.select(this).classed("highlight", true);
                    const name = d.properties.LGA_name;
                    const val = unemploymentMap[name.trim().toLowerCase()];
                    tooltip.transition().duration(200).style("opacity", 1);
                    tooltip.html(`<strong>${name}</strong><br/>${val ? val + ' unemployed' : 'No data'}`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 30) + "px");
                })
                .on("mouseout", function () {
                    d3.select(this).classed("highlight", false);
                    tooltip.transition().duration(200).style("opacity", 0);
                });

            // Draw red circles for cities
            svg.selectAll("circle")
                .data(cityData)
                .enter()
                .append("circle")
                .attr("cx", d => projection([+d.lon, +d.lat])[0])
                .attr("cy", d => projection([+d.lon, +d.lat])[1])
                .attr("r", 4)
                .attr("fill", "red")
                .attr("stroke", "#fff")
                .attr("stroke-width", 0.5)
                .on("mouseover", function (event, d) {
                    d3.select(this)
                        .transition().duration(100)
                        .attr("r", 6)
                        .attr("fill", "orange");

                    tooltip.transition().duration(200).style("opacity", 1);
                    tooltip.html(`<strong>${d.place}</strong>`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 30) + "px");
                })
                .on("mouseout", function () {
                    d3.select(this)
                        .transition().duration(100)
                        .attr("r", 4)
                        .attr("fill", "red");

                    tooltip.transition().duration(200).style("opacity", 0);
                });
        });
    </script>
</body>
</html>
