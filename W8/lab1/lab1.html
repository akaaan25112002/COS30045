<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8.1 D3 Victoria LGA Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .lga {
      fill: lightblue;
      stroke: white;
      stroke-width: 0.5;
    }
    .lga:hover {
      fill: orange;
    }
  </style>
</head>
<body>
  <h2>Lab 8.1 – Victoria LGAs (JSON)</h2>
  <svg width="600" height="600"></svg>

  <script>
    const width = 600;
    const height = 600;

    const svg = d3.select("svg");

    // Mercator projection centered on Victoria
    const projection = d3.geoMercator()
      .center([144.9631, -37.8136])  // Melbourne coords
      .translate([width / 2, height / 2])
      .scale(5000); // adjust zoom

    const path = d3.geoPath().projection(projection);

    // Load JSON file
    d3.json("LGA_VIC.json").then(function(geoData) {
      svg.selectAll("path")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("class", "lga")
        .attr("d", path)
        .append("title")
        .text(d => d.properties.LGA_name || "Unknown");
    });
  </script>
</body>
</html>
